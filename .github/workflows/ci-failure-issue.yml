name: Triage CI failure on main

# When a watched CI workflow fails on a push to `main`, ask Claude to triage it:
# read the failing logs, decide whether an open `ci-failure` issue already tracks
# this failure, and either comment on that issue or open a new one with a
# Claude-chosen title and a populated description.
#
# Cost control (hybrid): a cheap deterministic pre-check short-circuits the
# common fan-out -- one bad commit (e.g. a syntax error) failing many workflows.
# Claude embeds the commit SHA in the issue body it files, so sibling workflows
# that fail on the SAME commit find that issue in the pre-check and just leave a
# breadcrumb instead of spinning up another agentic run. The concurrency group
# (keyed on the commit) serializes these jobs so the pre-check reliably sees the
# already-filed issue. Claude only runs when there is real triage judgment to do.
#
# Auth reuses the Bedrock OIDC role the central pytorch/test-infra Claude
# workflow uses (environment: bedrock) -- no PAT, no Anthropic API key, and no
# change to pytorch/test-infra. Claude creates/comments via the job's
# GITHUB_TOKEN (issues: write).

on:
  workflow_run:
    # Names must match the `name:` field of each workflow. These are the
    # workflows that actually run on a push to `main`. `xpu-test` is excluded --
    # it only runs on `ciflow/xpu/*` tags and a weekly cron, never on main.
    workflows:
      - "Run Regression Tests"
      - "Run Regression Tests on ROCm"
      - "Run Regression Tests (aarch64)"
      - "Run 1xH100 Tests"
      - "Run 4xH100 tests"
      - "Run 1xL4 Tests"
      - "Run TorchAO Experimental MPS Tests"
      - "Code Analysis with Ruff"
      - "Build Docs"
      - "Build Linux Wheels (x86)"
      - "Build Linux Wheels (AArch64)"
      # CodeQL is GitHub "default setup" code scanning (configured in repo
      # Settings, not a workflow file). `workflow_run` may not fire for it
      # since it runs as a dynamic workflow -- listed optimistically; verify
      # it actually triggers before relying on it.
      - "CodeQL"
    types: [completed]

permissions:
  contents: read    # checkout + let Claude read source to find root cause
  issues: write     # Claude (and the pre-check) create/comment on issues
  actions: read     # read the failing run's logs
  id-token: write   # assume the Bedrock OIDC role

jobs:
  triage:
    # Only real push-to-main failures. event == 'push' excludes pull_request
    # runs (head_branch != main anyway) and schedule / workflow_dispatch runs
    # (which also execute on main but are not what this is meant to track).
    if: >
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: bedrock   # required: the OIDC role's subject condition allows
                           # repo:<org>/<repo>:environment:bedrock
    # Serialize reports for the same commit so that when several workflows fail
    # on one commit they don't each invoke Claude: the first files the issue,
    # the rest wait and then see it in the pre-check.
    concurrency:
      group: ci-failure-triage-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      # Cheap deterministic guard: if an open `ci-failure` issue already
      # references this commit (filed by a sibling workflow that failed on the
      # same commit), leave a breadcrumb and skip the expensive Claude run.
      - name: Pre-check for an issue already tracking this commit
        id: precheck
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          WF_NAME: ${{ github.event.workflow_run.name }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail
          # Match on the full SHA appearing in an issue body. Claude writes the
          # SHA into bodies it files (and appends SHAs when it dedups), so this
          # catches both same-commit siblings and known recurring commits.
          existing=$(gh issue list --repo "$REPO" \
            --state open --label ci-failure --limit 200 \
            --json number,body \
            --jq "[.[] | select(.body != null and (.body | contains(\"${SHA}\")))] | .[0].number // empty")
          if [ -n "$existing" ]; then
            echo "Commit ${SHA} already tracked by issue #${existing}; leaving a breadcrumb and skipping Claude."
            gh issue comment "$existing" --repo "$REPO" \
              --body ":warning: **${WF_NAME}** also failed on this commit (\`${SHA}\`) — ${RUN_URL}"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "No existing issue references ${SHA}; Claude will triage."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout failing commit
        if: steps.precheck.outputs.skip != 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 1

      - name: Configure AWS credentials via OIDC
        if: steps.precheck.outputs.skip != 'true'
        # Role ARN and region copied from pytorch/test-infra's
        # .github/workflows/_claude-code.yml -- the same role ao was onboarded to
        # for Claude-on-Bedrock. If test-infra rotates these, update them here too.
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::308535385114:role/gha_workflow_claude_code
          aws-region: us-east-1

      - name: Triage with Claude
        if: steps.precheck.outputs.skip != 'true'
        # Pinned to the same release pytorch/test-infra's _claude-code.yml uses.
        uses: anthropics/claude-code-action@b4d67413279fc18c6e5de930ae307c4f108714eb # v1.0.104
        with:
          use_bedrock: "true"
          github_token: ${{ github.token }}
          claude_args: "--model global.anthropic.claude-opus-4-6-v1"
          prompt: |
            A CI workflow failed on `main`:
            - Workflow: ${{ github.event.workflow_run.name }}
            - Commit:   ${{ github.event.workflow_run.head_sha }}
            - Run:      ${{ github.event.workflow_run.html_url }} (run id ${{ github.event.workflow_run.id }})

            Triage this failure. Do NOT modify code or push anything; your only
            outputs are a GitHub issue or a comment.

            1. Read the failing logs:
               `gh run view ${{ github.event.workflow_run.id }} --log-failed`.
               Identify the failure. If many tests fail with the same error, treat
               it as ONE root cause, not many. If it is a flaky test or an infra
               failure rather than a real regression, classify it as such.

            2. Check for duplicates:
               `gh issue list --label ci-failure --state open --json number,title,body`.
               Read them and decide whether THIS failure is already tracked. Judge
               by the underlying failure, not the workflow name -- the same root
               cause can break several workflows and recur across commits.

            3. If it is ALREADY tracked:
               - Append the commit `${{ github.event.workflow_run.head_sha }}` to a
                 "Commits affected:" line in that issue's body
                 (`gh issue edit <n> --body-file <file>`) WITHOUT changing the
                 analysis sections, so the pre-check keeps finding it.
               - Add a brief comment noting this run/commit and whether it matches
                 the existing diagnosis or differs.
               - Do NOT open a new issue.

            4. If it is NOT tracked, open a new issue with `gh issue create`:
               - Title: concise and specific, naming the failing test/symptom
                 (e.g. "test_x86inductor_quantizer: PortNodeMetaForQDQ pass fails on main").
               - Label: `ci-failure`.
               - Body, in this shape (include the SHA verbatim so automation can
                 detect it):

                 Commits affected: `${{ github.event.workflow_run.head_sha }}`
                 Run: ${{ github.event.workflow_run.html_url }}

                 ## Summary
                 <one-line root cause>

                 ## Failure details
                 - Failed job(s): ...
                 - Representative error: ...

                 ## Root cause
                 ...

                 ## Classification
                 real regression / flaky test / infra failure -- with justification

                 ## Suggested fix
                 <description; diff if you can>
